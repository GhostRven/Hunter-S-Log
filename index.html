<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inicio de Sesión - Sistema</title>

    <!-- Tailwind v4 via CDN -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;800;900&family=Uncial+Antiqua&display=swap"
      rel="stylesheet"
    />

    <!-- Animaciones Nativas -->
    <style>
      @keyframes gradientFlow {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }
      .animate-gradient-flow {
        background-size: 200% auto;
        animation: gradientFlow 5s linear infinite;
      }
    </style>

    <!-- CONFIGURACIÓN DE TAILWIND V4 -->
    <style type="text/tailwindcss">
      @theme {
        /* Fuentes */
        --font-medieval: "Uncial Antiqua", serif;
        --font-system: "Orbitron", sans-serif;

        /* Colores Personalizados */
        --color-sl-abyss: #050508;
        --color-sl-surface: #111116;
        --color-sl-cyan: #00e5ff;
        --color-sl-purple: #8b5cf6;
        --color-p5-blood: #e60012;
        --color-p5-gold: #fbbf24;
        --color-p5-paper: #f1f1f1;

        /* Sombras Glow */
        --shadow-glow-cyan: 0 0 15px rgba(0, 229, 255, 0.4);
      }
    </style>
  </head>

  <!-- Aplicamos el fondo abisal y flex para mantener el footer abajo -->
  <body
    class="bg-sl-abyss text-p5-paper font-system min-h-screen flex flex-col selection:bg-p5-blood selection:text-white"
  >
    <!-- HEADER -->
    <header
      class="p-6 border-b border-sl-cyan/20 bg-sl-surface/50 backdrop-blur-sm"
    >
      <h1
        class="text-2xl flex items-center justify-center text-sl-cyan uppercase tracking-widest font-black drop-shadow-[0_0_8px_rgba(0,229,255,0.8)]"
      >
        <div
          class="w-3 h-3 bg-sl-cyan rounded-full animate-pulse mr-3 shadow-glow-cyan"
        ></div>
        Aviso del Sistema
      </h1>
    </header>

    <!-- MAIN (Ocupa el espacio restante) -->
    <main class="flex-grow flex items-center justify-center p-4">
      <!-- 
        CAMBIO AQUÍ: Añadimos id="panel-login" y las clases de transición: 
        transition-all duration-500 ease-in-out origin-center 
      -->
      <section
        id="panel-login"
        class="bg-sl-surface border border-sl-cyan/30 shadow-glow-cyan p-8 max-w-md w-full relative overflow-hidden transition-all duration-500 ease-in-out origin-center"
      >
        <!-- Decoración esquinera de ventana de sistema -->
        <div
          class="absolute top-0 left-0 w-4 h-4 border-t-2 border-l-2 border-sl-cyan"
        ></div>
        <div
          class="absolute bottom-0 right-0 w-4 h-4 border-b-2 border-r-2 border-sl-cyan"
        ></div>

        <p
          class="text-sm text-sl-cyan/80 text-center mb-8 border-b border-sl-purple/30 pb-4"
        >
          Si no tienes cuenta, contacta con el administrador del gremio. Hasta
          que se implemente la función de registro.
        </p>

        <form class="space-y-6">
          <!-- Input 1 -->
          <div class="flex flex-col">
            <label
              class="text-xs uppercase tracking-widest text-sl-purple mb-2 font-bold"
              >Cazador :</label
            >
            <input
              type="text"
              placeholder="Tu nombre"
              class="bg-black/50 border border-sl-cyan/40 text-sl-cyan p-3 outline-none focus:border-sl-cyan focus:shadow-glow-cyan transition-all placeholder:text-sl-cyan/20"
            />
          </div>

          <!-- Input 2 -->
          <div class="flex flex-col">
            <label
              class="text-xs uppercase tracking-widest text-sl-purple mb-2 font-bold"
              >Contraseña :</label
            >
            <input
              type="password"
              placeholder="••••••••"
              class="bg-black/50 border border-sl-cyan/40 text-sl-cyan p-3 outline-none focus:border-sl-cyan focus:shadow-glow-cyan transition-all placeholder:text-sl-cyan/20 font-sans"
            />
          </div>

          <!-- 
            CAMBIO AQUÍ: onclick llama a la función entrarAlPortal(event) 
          -->
          <button
            type="button"
            class="w-full mt-4 bg-p5-blood border-2 border-p5-blood text-white font-black text-lg py-3 -skew-x-6 hover:bg-transparent hover:text-p5-blood transition-colors group relative overflow-hidden"
            onclick="entrarAlPortal(event)"
          >
            <!-- Fondo extra para efecto hover P5R -->
            <div
              class="absolute inset-0 bg-white translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out z-0"
            ></div>
            <!-- Texto desinclinado para que se lea bien -->
            <span class="skew-x-6 block relative z-10 tracking-widest">
              ENTRAR AL PORTAL
            </span>
          </button>
        </form>
      </section>
    </main>

    <!-- FOOTER -->
    <footer
      class="border-t border-sl-purple/30 bg-sl-surface p-6 flex flex-col sm:flex-row items-center justify-center gap-2 sm:gap-6 text-sm"
    >
      <span class="text-gray-500">© 2026 Hunter'S Log</span>
      <span class="hidden sm:inline text-gray-700">|</span>
      <span
        class="font-bold text-lg tracking-wider bg-gradient-to-r from-sl-cyan via-sl-purple to-p5-blood bg-clip-text text-transparent animate-gradient-flow inline-block"
      >
        GhostRaven
      </span>
    </footer>

    <!-- SCRIPT DE TRANSICIÓN -->
    <script>
      function entrarAlPortal(event) {
        // Evita el salto inmediato
        event.preventDefault();

        // Seleccionamos el panel de inicio de sesión
        const panel = document.getElementById("panel-login");

        // Añadimos clases de Tailwind para colapsar la pantalla (efecto apagado)
        panel.classList.add("scale-y-0", "scale-x-50", "opacity-0");

        // Retrasamos la redirección 500ms (lo que dura la transición)
        setTimeout(() => {
          window.location.href = "principal.html";
        }, 500);
      }
    </script>
  </body>
</html>
