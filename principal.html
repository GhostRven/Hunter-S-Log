<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hunter's Log - Dashboard</title>

    <!-- Tailwind v4 via CDN -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;800;900&family=Uncial+Antiqua&display=swap"
      rel="stylesheet"
    />

    <!-- Animaciones Nativas -->
    <style>
      @keyframes gradientFlow {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }
      .animate-gradient-flow {
        background-size: 200% auto;
        animation: gradientFlow 5s linear infinite;
      }
    </style>

    <!-- CONFIGURACIÓN DE TAILWIND V4 -->
    <style type="text/tailwindcss">
      @theme {
        /* Fuentes */
        --font-medieval: "Uncial Antiqua", serif;
        --font-system: "Orbitron", sans-serif;

        /* Colores Personalizados */
        --color-sl-abyss: #050508;
        --color-sl-surface: #111116;
        --color-sl-cyan: #00e5ff;
        --color-sl-purple: #8b5cf6;
        --color-p5-blood: #e60012;
        --color-p5-gold: #fbbf24;
        --color-p5-paper: #f1f1f1;

        /* Sombras Glow */
        --shadow-glow-cyan: 0 0 15px rgba(0, 229, 255, 0.4);

        /* AQUÍ AÑADIMOS LA ANIMACIÓN DE APERTURA */
        --animate-system-open: systemOpen 0.6s cubic-bezier(0.16, 1, 0.3, 1)
          forwards;
      }

      /* Definimos los pasos de la animación */
      @keyframes systemOpen {
        0% {
          opacity: 0;
          transform: scaleY(0.01) scaleX(0.5); /* Línea horizontal aplastada */
        }
        50% {
          opacity: 1;
          transform: scaleY(0.01) scaleX(1); /* Se expande hacia los lados */
        }
        100% {
          opacity: 1;
          transform: scaleY(1) scaleX(1); /* Se abre verticalmente */
        }
      }
    </style>
  </head>

  <!-- Aplicamos el fondo abisal y flex para mantener el footer abajo -->
  <body
    class="bg-sl-abyss text-p5-paper font-system min-h-screen flex flex-col selection:bg-p5-blood selection:text-white"
  >
    <!-- HEADER -->
    <header
      class="p-6 border-b border-sl-cyan/20 bg-sl-surface/50 backdrop-blur-sm z-10"
    >
      <h1
        class="text-3xl flex items-center justify-center text-sl-cyan uppercase tracking-[0.2em] font-black drop-shadow-[0_0_10px_rgba(0,229,255,0.8)]"
      >
        <!-- Rombo animado izquierdo -->
        <div
          class="w-3 h-3 bg-sl-cyan rounded-none rotate-45 animate-pulse mr-4 shadow-glow-cyan"
        ></div>
        Hunter's Log
        <!-- Rombo animado derecho -->
        <div
          class="w-3 h-3 bg-sl-cyan rounded-none rotate-45 animate-pulse ml-4 shadow-glow-cyan"
        ></div>
      </h1>
    </header>

    <!-- MAIN DASHBOARD -->
    <main class="flex-grow flex items-center justify-center p-4 md:p-8">
      <!-- CONTENEDOR DEL DASHBOARD CON ANIMACIÓN DE APERTURA -->
      <section
        class="bg-sl-surface border border-sl-cyan/30 shadow-glow-cyan p-8 w-full max-w-6xl min-h-[60vh] relative overflow-hidden animate-system-open origin-center flex flex-col"
      >
        <!-- Decoración esquinera de ventana de sistema -->
        <div
          class="absolute top-0 left-0 w-4 h-4 border-t-2 border-l-2 border-sl-cyan"
        ></div>
        <div
          class="absolute bottom-0 right-0 w-4 h-4 border-b-2 border-r-2 border-sl-cyan"
        ></div>

        <!-- Título interno de la sección -->
        <h2
          class="text-xl text-sl-purple font-bold tracking-widest uppercase mb-6 border-b border-sl-purple/30 pb-3 flex justify-between items-end"
        >
          <span>Resumen de Cacería</span>
          <span class="text-xs text-sl-cyan/60">ESTADO: SINCRONIZADO</span>
        </h2>

        <!-- Aquí es donde pondremos las listas de juegos/mangas/etc más adelante -->
        <div
          class="flex-grow flex flex-col items-center justify-center text-center text-sl-cyan/40 space-y-4"
        >
          <div
            class="w-16 h-16 border-4 border-sl-cyan/20 border-t-sl-cyan rounded-full animate-spin"
          ></div>
          <p class="tracking-widest animate-pulse">CARGANDO CÓDICE...</p>
        </div>
      </section>
    </main>

    <!-- FOOTER -->
    <footer
      class="border-t border-sl-purple/30 bg-sl-surface p-6 flex flex-col sm:flex-row items-center justify-center gap-2 sm:gap-6 text-sm"
    >
      <span class="text-gray-500">© 2026 Hunter'S Log</span>
      <span class="hidden sm:inline text-gray-700">|</span>
      <span
        class="font-bold text-lg tracking-wider bg-gradient-to-r from-sl-cyan via-sl-purple to-p5-blood bg-clip-text text-transparent animate-gradient-flow inline-block"
      >
        GhostRaven
      </span>
    </footer>
  </body>
</html>
